<svg viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="640" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="140" y="40" width="680" height="530" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2328">Sistema EPIGuard</text>

  <!-- Association lines: Tecnico (x=60,y=290) to all 8 use cases -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="60" y1="290" x2="205" y2="110"/>
    <line x1="60" y1="290" x2="205" y2="230"/>
    <line x1="60" y1="290" x2="205" y2="350"/>
    <line x1="60" y1="290" x2="205" y2="470"/>
    <line x1="60" y1="290" x2="505" y2="110"/>
    <line x1="60" y1="290" x2="505" y2="230"/>
    <line x1="60" y1="290" x2="505" y2="350"/>
    <line x1="60" y1="290" x2="505" y2="470"/>
  </g>

  <!-- Actor: Tecnico de Seguranca -->
  <g stroke="#1E2328" stroke-width="2" fill="none">
    <circle cx="60" cy="235" r="12" fill="#ffffff"/>
    <line x1="60" y1="247" x2="60" y2="290"/>
    <line x1="38" y1="262" x2="82" y2="262"/>
    <line x1="60" y1="290" x2="42" y2="322"/>
    <line x1="60" y1="290" x2="78" y2="322"/>
  </g>
  <text x="60" y="345" text-anchor="middle" font-size="13" fill="#1E2328">Técnico de</text>
  <text x="60" y="361" text-anchor="middle" font-size="13" fill="#1E2328">Segurança</text>

  <!-- Actor: Administrador (generalizacao: herda os casos de uso do Tecnico) -->
  <g stroke="#1E2328" stroke-width="2" fill="none">
    <circle cx="60" cy="450" r="12" fill="#ffffff"/>
    <line x1="60" y1="462" x2="60" y2="505"/>
    <line x1="38" y1="477" x2="82" y2="477"/>
    <line x1="60" y1="505" x2="42" y2="537"/>
    <line x1="60" y1="505" x2="78" y2="537"/>
  </g>
  <text x="60" y="560" text-anchor="middle" font-size="13" fill="#1E2328">Administrador</text>
  <line x1="60" y1="438" x2="60" y2="386" stroke="#1E2328" stroke-width="1.5"/>
  <path d="M60,372 L52,386 L68,386 Z" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>

  <!-- Use case ovals: column A x=330, column B x=630 -->
  <g>
    <ellipse cx="330" cy="110" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="330" y="115" text-anchor="middle" font-size="14" fill="#1E2328">Login</text>

    <ellipse cx="330" cy="230" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="330" y="235" text-anchor="middle" font-size="14" fill="#1E2328">Cadastrar Colaborador</text>

    <ellipse cx="330" cy="350" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="330" y="355" text-anchor="middle" font-size="14" fill="#1E2328">Cadastrar EPI</text>

    <ellipse cx="330" cy="470" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="330" y="475" text-anchor="middle" font-size="14" fill="#1E2328">Registrar Entrega</text>

    <ellipse cx="630" cy="110" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="630" y="115" text-anchor="middle" font-size="14" fill="#1E2328">Registrar Devolução / Descarte</text>

    <ellipse cx="630" cy="230" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="630" y="235" text-anchor="middle" font-size="14" fill="#1E2328">Consultar Histórico</text>

    <ellipse cx="630" cy="350" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="630" y="349" text-anchor="middle" font-size="14" fill="#1E2328">Ver Alertas de</text>
    <text x="630" y="365" text-anchor="middle" font-size="14" fill="#1E2328">Vencimento</text>

    <ellipse cx="630" cy="470" rx="125" ry="34" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="630" y="475" text-anchor="middle" font-size="14" fill="#1E2328">Ver Dashboard</text>
  </g>

  <!-- <<include>>: Cadastrar Colaborador -> Login -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B4620D"/>
    </marker>
  </defs>
  <line x1="330" y1="196" x2="330" y2="146" stroke="#B4620D" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="340" y="175" font-size="12" font-style="italic" fill="#B4620D">«include»</text>

  <!-- <<extend>>: Ver Alertas de Vencimento -> Ver Dashboard -->
  <line x1="630" y1="384" x2="630" y2="436" stroke="#1B6C70" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1B6C70"/>
    </marker>
  </defs>
  <text x="640" y="415" font-size="12" font-style="italic" fill="#1B6C70">«extend»</text>

  <!-- Legend -->
  <g font-size="12" fill="#5B6570">
    <line x1="160" y1="595" x2="190" y2="595" stroke="#333333" stroke-width="1.2"/>
    <text x="196" y="599">associação</text>
    <line x1="160" y1="618" x2="178" y2="618" stroke="#1E2328" stroke-width="1.5"/>
    <path d="M190,618 L178,611 L178,625 Z" fill="#ffffff" stroke="#1E2328" stroke-width="1.5"/>
    <text x="196" y="622">generalização (Administrador herda os casos de uso do Técnico)</text>
    <line x1="300" y1="595" x2="330" y2="595" stroke="#B4620D" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="336" y="599">«include» (depende de)</text>
    <line x1="540" y1="595" x2="570" y2="595" stroke="#1B6C70" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow2)"/>
    <text x="576" y="599">«extend» (estende opcionalmente)</text>
  </g>
</svg>
